<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="100%" stop-color="#0f1922"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark rounded container with emerald edge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Phone Handset icon -->
  <g transform="translate(18, 22) scale(0.66)">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" 
          transform="scale(4)" 
          fill="none" 
          stroke="url(#phoneGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>

  <!-- Gemini AI 4-Point Sparkle Star -->
  <g transform="translate(74, 22)">
    <path d="M 24 0 C 24 13.2, 13.2 24, 0 24 C 13.2 24, 24 34.8, 24 48 C 24 34.8, 34.8 24, 48 24 C 34.8 24, 24 13.2, 24 0 Z" 
          fill="url(#geminiGrad)" 
          filter="url(#glow)" />
    <circle cx="24" cy="24" r="3.5" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Accent small AI Sparkle -->
  <g transform="translate(46, 12) scale(0.5)">
    <path d="M 16 0 C 16 8.8, 8.8 16, 0 16 C 8.8 16, 16 23.2, 16 32 C 16 23.2, 23.2 16, 32 16 C 23.2 16, 16 8.8, 16 0 Z" 
          fill="url(#geminiGrad)" opacity="0.85" />
  </g>
</svg>
